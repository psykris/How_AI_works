<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>How AI Actually Works  -  A Field Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080c;
  --card:#0f0f15;
  --card2:#141420;
  --line:#1f1f2e;
  --text:#d8d8e8;
  --soft:#8a8aa8;
  --dim:#3a3a50;
  --white:#f0f0f8;
}
html{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:18px}
body{min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
a{text-decoration:none;color:inherit}
button{outline:none;border:none;cursor:pointer;background:none;font-family:inherit}

/* NAV */
#nav{
  position:sticky;top:0;z-index:50;
  background:rgba(8,8,12,0.97);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;
  padding:0 36px;height:62px;gap:24px;
}
#nav-brand{
  font-family:'Instrument Serif',serif;
  font-size:18px;color:var(--soft);
  white-space:nowrap;flex-shrink:0;
}
#nav-tabs{
  display:flex;align-items:center;gap:3px;
  flex:1;overflow-x:auto;
}
#nav-tabs::-webkit-scrollbar{display:none}
.ntab{
  display:flex;align-items:center;gap:8px;
  padding:7px 16px;border-radius:9px;
  font-size:14px;font-weight:500;
  color:var(--soft);transition:all 0.16s;
  white-space:nowrap;flex-shrink:0;border:1px solid transparent;
}
.ntab:hover{color:var(--white);background:var(--card2)}
.ntab.on{color:var(--white)}
.ntab-emoji{font-size:16px;line-height:1}

/* HERO */
#hero{
  padding:64px 72px 52px;
  border-bottom:1px solid var(--line);
  position:relative;overflow:hidden;
  min-height:280px;
}
#hero::before{
  content:attr(data-emoji);
  position:absolute;top:-10px;right:50px;
  font-size:230px;opacity:0.12;
  pointer-events:none;line-height:1;
}
.hero-num{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  letter-spacing:0.16em;text-transform:uppercase;
  margin-bottom:16px;display:block;
}
.hero-name{
  font-family:'Instrument Serif',serif;
  font-size:56px;letter-spacing:-0.02em;line-height:1;
  color:var(--white);margin-bottom:12px;
}
.hero-analogy{
  font-size:15px;color:var(--soft);margin-bottom:28px;
  font-style:italic;
}
.hero-desc{
  font-size:17px;line-height:1.85;color:#b4b4cc;
  max-width:680px;border-left:2px solid;padding-left:22px;
}

/* CONTENT */
#page{padding:52px 72px 90px;max-width:1240px;width:100%;margin:0 auto}

/* SECTION */
.sec{margin-bottom:60px}
.sec-head{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:0.18em;text-transform:uppercase;
  color:var(--dim);margin-bottom:22px;
  display:flex;align-items:center;gap:14px;
}
.sec-head::after{content:'';flex:1;height:1px;background:var(--line)}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:22px 24px;
}
.stat-label{
  font-size:13px;color:var(--soft);
  margin-bottom:12px;line-height:1.45;
}
.stat-value{
  font-family:'Instrument Serif',serif;
  font-size:30px;color:var(--white);line-height:1;
}
.stat-context{
  font-size:12px;margin-top:9px;
  color:var(--soft);line-height:1.55;
  font-family:'JetBrains Mono',monospace;
}

/* PLAYERS */
.player-list{display:flex;flex-direction:column;gap:8px}
.player{
  display:grid;grid-template-columns:1fr auto;
  gap:20px;align-items:center;
  padding:18px 22px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  transition:background 0.14s;
}
.player:hover{background:var(--card2)}
.player-name{font-weight:600;font-size:15px;color:var(--white);margin-bottom:4px}
.player-role{font-size:13px;color:var(--soft)}
.player-right{text-align:right;flex-shrink:0}
.player-stat{
  font-family:'Instrument Serif',serif;font-size:20px;color:var(--white);
}
.player-statlab{font-size:12px;color:var(--soft);margin-top:3px}

/* CHART */
.chart-wrap{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:30px 28px 22px;overflow-x:auto;
}
.chart-toprow{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:28px;
}
.chart-heading{font-size:15px;font-weight:600;color:var(--white)}
.chart-legend{
  display:flex;gap:16px;align-items:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--soft);
}
.leg-item{display:flex;align-items:center;gap:6px}
.leg-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.leg-proj{
  background:repeating-linear-gradient(45deg,transparent 0,transparent 2px,rgba(255,255,255,0.25) 2px,rgba(255,255,255,0.25) 4px);
  border:1px solid rgba(255,255,255,0.2);
}
.chart-body{display:flex;gap:0;align-items:stretch}
.y-axis{
  display:flex;flex-direction:column;justify-content:space-between;
  padding-right:14px;padding-bottom:36px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--soft);text-align:right;width:52px;flex-shrink:0;
}
.chart-right{flex:1;display:flex;flex-direction:column}
.gridlines{
  position:relative;border-left:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:space-between;
}
.gridline{width:100%;height:1px;background:var(--line);opacity:0.4}
.bars-overlay{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;gap:8px;padding:0 8px;
}
.bar-col{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;height:100%;
  position:relative;
}
.bar-val{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  margin-bottom:4px;white-space:nowrap;text-align:center;
}
.bar{
  width:100%;border-radius:4px 4px 0 0;
  transition:height 0.6s cubic-bezier(.22,.8,.24,1);
  min-height:3px;
}
.bar.proj{
  background:repeating-linear-gradient(
    45deg,transparent 0,transparent 2px,
    rgba(255,255,255,0.2) 2px,rgba(255,255,255,0.2) 4px
  )!important;
}
.x-labels{
  display:flex;gap:8px;padding:10px 8px 0;
  border-top:1px solid var(--line);
}
.x-label{
  flex:1;text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--soft);
}

/* FORECAST */
.forecast-nums{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;
}
.fncard{
  background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:16px 20px;
}
.fnlabel{font-size:12px;color:var(--soft);margin-bottom:8px}
.fnval{
  font-family:'Instrument Serif',serif;
  font-size:26px;color:var(--white);
}
.forecast-box{
  padding:26px 30px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);
  border-left:3px solid;margin-top:18px;
}
.forecast-text{
  font-size:16px;line-height:1.85;color:#a8a8c0;
}

/* STACK BARS */
.stack-widget{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:26px 28px;
}
.stack-intro{font-size:14px;color:var(--soft);margin-bottom:24px;line-height:1.65}
.sbar-row{
  display:flex;align-items:center;gap:14px;
  padding:8px 10px;border-radius:9px;cursor:pointer;
  transition:background 0.14s;margin-bottom:8px;
}
.sbar-row:last-child{margin-bottom:0}
.sbar-row:hover{background:var(--card2)}
.sbar-name{
  width:190px;flex-shrink:0;font-size:13px;
  display:flex;align-items:center;gap:8px;
}
.sbar-emoji{font-size:16px}
.sbar-track{flex:1;background:var(--line);border-radius:4px;height:14px;overflow:hidden}
.sbar-fill{height:100%;border-radius:4px;transition:width 0.5s cubic-bezier(.22,.8,.24,1)}
.sbar-amt{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--soft);width:58px;text-align:right;flex-shrink:0;
}

/* RESOURCES */
.res-grid{display:flex;flex-direction:column;gap:10px}
.res-card{
  display:flex;gap:18px;align-items:flex-start;
  padding:20px 24px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;
  transition:all 0.18s;
}
.res-card:hover{background:var(--card2);border-color:#333}
.res-idx{
  font-family:'Instrument Serif',serif;font-size:26px;
  flex-shrink:0;width:30px;line-height:1;margin-top:2px;
}
.res-title{font-weight:600;font-size:15px;color:var(--white);margin-bottom:6px}
.res-desc{font-size:14px;color:var(--soft);line-height:1.65}
.res-domain{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--dim);margin-top:8px;
}

/* WHAT THIS MEANS FOR YOU */
.industry-grid{display:flex;flex-direction:column;gap:12px}
.industry-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:24px 28px;
}
.industry-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;margin-bottom:18px;cursor:pointer;
}
.industry-icon{font-size:28px;flex-shrink:0;margin-top:2px}
.industry-title{font-size:17px;font-weight:700;color:var(--white);margin-bottom:5px}
.industry-tagline{font-size:13px;color:var(--soft);line-height:1.5}
.industry-risk{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  padding:4px 10px;border-radius:6px;white-space:nowrap;flex-shrink:0;
}
.industry-body{font-size:14px;color:#a0a0bc;line-height:1.8}
.industry-body p{margin-bottom:12px}
.industry-body p:last-child{margin-bottom:0}
.industry-stat{
  display:inline-block;font-family:'Instrument Serif',serif;
  font-size:18px;font-weight:400;margin-right:4px;
}

.upskill-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upskill-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:22px 24px;
}
.upskill-icon{font-size:22px;margin-bottom:12px}
.upskill-title{font-size:15px;font-weight:700;color:var(--white);margin-bottom:8px}
.upskill-body{font-size:13px;color:var(--soft);line-height:1.7}

.closing-box{
  background:var(--card);border:1px solid var(--line);
  border-left:3px solid;border-radius:14px;
  padding:28px 32px;margin-top:0;
}
.closing-box p{
  font-family:'DM Sans',sans-serif;font-size:24px;
  line-height:1.75;color:#c0c0d8;
  font-style:normal;
}

/* FOOTER NAV */
#footer-nav{
  border-top:1px solid var(--line);
  padding:22px 72px;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;
}
.fnav-btn{
  display:flex;align-items:center;gap:10px;
  padding:12px 22px;border-radius:11px;
  border:1px solid var(--line);
  font-size:15px;font-weight:500;color:var(--soft);
  transition:all 0.16s;white-space:nowrap;
}
.fnav-btn:hover:not([disabled]){border-color:#444;color:var(--white);background:var(--card)}
.fnav-btn[disabled]{opacity:0.2;cursor:default}
.fnav-center{text-align:center;flex:1}
.fnav-pips{display:flex;gap:7px;align-items:center;justify-content:center;margin-bottom:6px}
.fpip{height:7px;border-radius:4px;cursor:pointer;transition:all 0.26s;border:none}
.fpip:hover{opacity:0.8}
#fnav-label{font-size:13px;color:var(--soft)}

@media(max-width:780px){
  #hero,#page,#footer-nav{padding-left:22px;padding-right:22px}
  .hero-name{font-size:38px}
  .stat-grid{grid-template-columns:1fr}
  .player{grid-template-columns:1fr;gap:10px}
  .player-right{text-align:left}
  .forecast-nums{grid-template-columns:1fr}
  #nav{padding:0 18px}
  #nav-brand{display:none}
  .upskill-grid{grid-template-columns:1fr}
  .industry-header{flex-direction:column;align-items:flex-start}
  .chart-body{min-width:560px}
  .sbar-name{width:150px}
}

@media(max-width:480px){
  html{font-size:16px}
  #hero{padding-top:40px;padding-bottom:36px}
  .hero-name{font-size:32px}
  .hero-desc{font-size:15px;line-height:1.7;padding-left:14px}
  #hero::before{font-size:150px;right:16px;top:8px;opacity:0.18}
  .chart-wrap{padding:18px 14px 14px}
  .stack-widget,.industry-card,.upskill-card,.forecast-box,.stat,.player,.res-card{padding:16px}
  .sbar-name{width:126px;font-size:12px}
}
</style>
</head>
<body>
<nav id="nav">
  <div id="nav-brand">How AI Works</div>
  <div id="nav-tabs"></div>
</nav>
<div id="hero" data-emoji="">
  <span class="hero-num" id="h-num"></span>
  <div class="hero-name" id="h-name"></div>
  <div class="hero-analogy" id="h-analogy"></div>
  <p class="hero-desc" id="h-desc"></p>
</div>
<div id="page"></div>
<div id="footer-nav">
  <button class="fnav-btn" id="fn-prev" onclick="prev()">&#8592; Previous</button>
  <div class="fnav-center">
    <div class="fnav-pips" id="fn-pips"></div>
    <div id="fnav-label"></div>
  </div>
  <button class="fnav-btn" id="fn-next" onclick="next()">Next &#8594;</button>
</div>
<script>
// GLOBAL chart max across all layers so bars are proportionally accurate
const GLOBAL_CHART_MAX = 600; // apps layer hits $600B  -  everything else scales against this

const LAYERS = [
{
  id:1,emoji:"⚡",
  name:"Chips & Hardware",
  tag:"Layer 1 of 5 - The Foundation",
  analogy:"Think of this as the engine. Without it, no car moves.",
  color:"#F97316",activebg:"rgba(249,115,22,0.1)",
  desc:"Every AI model you have ever used  -  ChatGPT, Midjourney, Google Translate  -  runs on specialized computer chips called GPUs. A GPU can do thousands of calculations simultaneously, which is exactly what AI needs. NVIDIA makes the dominant chip. In 2024, their AI chip business alone generated more revenue than the entire GDP of many countries.",
  stats:[
    {label:"NVIDIA AI chip revenue in 2024",value:"$115B",ctx:"The entire AI chip market was $46B in 2023. It more than doubled in one year. For context: the global film industry makes about $90B per year."},
    {label:"Cost of one H100 chip (NVIDIA flagship)",value:"~$30K",ctx:"A single chip. Data centers buy thousands. OpenAI reportedly uses 25,000+ to run ChatGPT at scale."},
    {label:"Wait time to buy new AI chips in 2025",value:"52 weeks",ctx:"A full year. Demand is so high that even trillion-dollar companies must queue up. Apple waited. Google waited. Everyone waits."},
    {label:"NVIDIA share of the AI chip market",value:"~85%",ctx:"AMD, Google, and Amazon are all trying to compete  -  but none have come close to matching NVIDIA yet."},
    {label:"Advanced AI chips fabricated by TSMC",value:">90%",ctx:"TSMC in Taiwan makes the most advanced chips for everyone: NVIDIA, Apple, AMD. It is the world's most strategically important factory."},
    {label:"Global HBM memory supply held by SK Hynix",value:"~95%",ctx:"HBM is the ultra-fast memory AI chips require. One South Korean company makes almost all of it. A supply disruption would halt AI globally."},
  ],
  players:[
    {name:"NVIDIA",role:"Makes the GPUs everyone wants",stat:"$115B",statlab:"AI revenue 2024"},
    {name:"TSMC",role:"Fabricates the chips  -  based in Taiwan",stat:">90%",statlab:"of advanced AI chips built here"},
    {name:"AMD",role:"Closest competitor to NVIDIA",stat:"MI300X",statlab:"192GB memory  -  beats H100 on that metric"},
    {name:"Google",role:"Builds its own chips (TPUs) for internal use",stat:"393 TFLOPS",statlab:"TPU v5e performance"},
    {name:"Amazon AWS",role:"Makes Trainium chips for their own cloud",stat:"3.8 PFLOPS",statlab:"per Trainium2 chip"},
    {name:"SK Hynix",role:"Makes the HBM memory AI chips depend on",stat:"~95%",statlab:"of world HBM3E supply"},
  ],
  forecast:{m24:"$46B",m30:"$200B",cagr:"~29%/yr",
    text:"Every major tech company is now designing their own AI chips  -  Google, Amazon, Meta, Microsoft. They want to reduce dependence on NVIDIA. But NVIDIA has a decade-long head start in software (called CUDA) that has trained over 10 million developers. Switching away from CUDA is like asking every baker in the world to replace ovens with campfires overnight. Technically possible  -  practically, it takes years. Expect NVIDIA to dominate through 2027, with competition chipping away gradually after that."},
  chart:[
    {y:"2024",v:46,label:"$46B"},
    {y:"2025",v:78,label:"$78B"},
    {y:"2026",v:108,label:"$108B",p:1},
    {y:"2027",v:140,label:"$140B",p:1},
    {y:"2028",v:163,label:"$163B",p:1},
    {y:"2029",v:183,label:"$183B",p:1},
    {y:"2030",v:200,label:"$200B",p:1},
  ],
  resources:[
    {title:"Chip War  -  Chris Miller",url:"https://www.chipwarbook.com/",desc:"The story of how the world became dependent on semiconductors, written like a thriller. Explains why Taiwan controls the world's most important factories and why governments are alarmed.",domain:"chipwarbook.com"},
    {title:"Epoch AI: Compute Tracker",url:"https://epochai.org/data/notable-ai-models",desc:"A live database showing how much computing power trained every major AI model. The trend line going up and to the right is the single most important chart in AI. Bookmark it.",domain:"epochai.org"},
    {title:"SemiAnalysis Newsletter",url:"https://semianalysis.com/",desc:"Deep technical analysis of chip supply chains and GPU architectures. Free articles available. Where industry insiders actually get their information.",domain:"semianalysis.com"},
    {title:"NVIDIA GTC 2024 Keynote",url:"https://www.nvidia.com/en-us/events/gtc/",desc:"Watch Jensen Huang reveal new chips live. It has become the AI equivalent of an Apple event  -  except the audience is engineers, not consumers, and the stakes are considerably higher.",domain:"nvidia.com"},
    {title:"WikiChip: H100 Architecture",url:"https://en.wikichip.org/wiki/WikiChip",desc:"Detailed technical breakdown of exactly what is inside NVIDIA's flagship AI chip  -  what makes it fast, how memory works, and why competitors struggle to replicate it.",domain:"en.wikichip.org"},
  ],
},
{
  id:2,emoji:"🏗️",
  name:"Data Centers",
  tag:"Layer 2 of 5 - The Buildings",
  analogy:"Think of this as the power plant and the building that houses the engine.",
  color:"#06B6D4",activebg:"rgba(6,182,212,0.1)",
  desc:"Those chips need to live somewhere. Data centers are enormous buildings  -  sometimes the size of 20 football fields  -  packed with servers, cooled by industrial systems, and powered by as much electricity as a small city. Amazon, Google, and Microsoft are spending more money building these in 2025 than the annual GDP of most countries.",
  stats:[
    {label:"Combined spending by top 4 tech companies on data centers in 2025",value:"$320B+",ctx:"Microsoft ($80B), Google ($75B), Amazon ($104B), Meta ($65B). In a single year. On buildings and servers."},
    {label:"US government AI infrastructure pledge (Stargate)",value:"$500B",ctx:"A joint initiative by OpenAI, SoftBank, Oracle, and the US government to build AI data centers across America. Announced January 2025."},
    {label:"Electricity used by one rack of NVIDIA's newest chips",value:"163 kW",ctx:"One equipment rack. That is enough to power roughly 150 homes. A large data center contains thousands of racks."},
    {label:"Share of AI infrastructure running in the cloud",value:"84%",ctx:"vs 16% in companies' own buildings. Nearly everything now runs in rented data centers."},
    {label:"US share of global AI infrastructure spending",value:"76%",ctx:"The US dominates. The EU, India, and the Middle East are all racing to build their own capacity."},
    {label:"Electricity consumed in Virginia's Data Center Alley",value:">1.5 GW",ctx:"One corridor near Ashburn, VA. More AI compute per square mile than anywhere on Earth. It has its own power grid challenges."},
  ],
  players:[
    {name:"Amazon AWS",role:"Largest cloud provider overall",stat:"31%",statlab:"global cloud market share"},
    {name:"Microsoft Azure",role:"Fastest-growing AI cloud",stat:"$80B",statlab:"planned capital spend 2025"},
    {name:"Google Cloud",role:"Runs its own TPU chips in-cloud",stat:"$75B",statlab:"planned capital spend 2025"},
    {name:"Meta",role:"Builds only for itself, not customers",stat:"350K",statlab:"H100 chips in its 2024 cluster"},
    {name:"CoreWeave",role:"GPU-only cloud for AI companies",stat:"$23B",statlab:"valuation at 2025 IPO"},
    {name:"Equinix",role:"Rents data center space to everyone",stat:"260+",statlab:"facilities in 70 countries"},
  ],
  forecast:{m24:"$95B",m30:"$280B",cagr:"~22%/yr",
    text:"The electricity problem is real and urgent. A single large AI data center can consume as much power as a mid-size city. Microsoft signed a deal to restart Three Mile Island nuclear plant. Google is funding small modular reactors. Amazon purchased a nuclear-powered data center outright. This is not marketing  -  it is the only realistic way to meet demand. By 2026, liquid cooling (pumping coolant directly past chips instead of blowing air) becomes the standard. Countries unable to build sufficient data centers will need to rent capacity from the US or fall measurably behind in AI capability."},
  chart:[
    {y:"2024",v:95,label:"$95B"},
    {y:"2025",v:148,label:"$148B"},
    {y:"2026",v:183,label:"$183B",p:1},
    {y:"2027",v:215,label:"$215B",p:1},
    {y:"2028",v:242,label:"$242B",p:1},
    {y:"2029",v:263,label:"$263B",p:1},
    {y:"2030",v:280,label:"$280B",p:1},
  ],
  resources:[
    {title:"IEA: Electricity 2025 Report",url:"https://www.iea.org/reports/electricity-2025",desc:"The International Energy Agency's official forecast for global electricity use, with a major focus on AI data centers. The most credible numbers on how much power AI will consume through 2027.",domain:"iea.org"},

{
  id:3,emoji:"🧰",
  name:"Tools & Frameworks",
  tag:"Layer 3 of 5 - The Software Workshop",
  analogy:"Think of this as the workshop  -  the tools that let engineers actually build things with the engine.",
  color:"#8B5CF6",activebg:"rgba(139,92,246,0.1)",
  desc:"Chips alone do not make AI. Engineers need software to tell those chips what to do. PyTorch (made by Meta, used by almost everyone) is the tool most AI researchers write their code in. CUDA (NVIDIA's programming language for GPUs) is what makes it fast. These tools are mostly free  -  but the companies behind them gain enormous influence over how all AI is built.",
  stats:[
    {label:"AI research papers written using PyTorch",value:"~77%",ctx:"Meta released PyTorch for free in 2016. It became the standard tool for AI research almost overnight. TensorFlow by Google holds about 17%."},
    {label:"AI models hosted on Hugging Face",value:"500K+",ctx:"Hugging Face is like GitHub for AI models  -  a free platform where researchers share their work. Half a million models and growing rapidly."},
    {label:"Developers trained on NVIDIA's CUDA system",value:"10M+",ctx:"CUDA is the programming language that makes GPUs fast for AI. Learning it takes months. This is the deepest reason switching away from NVIDIA is so difficult."},
    {label:"Market size for MLOps tools in 2024",value:"~$5B",ctx:"MLOps covers tools that help companies manage AI in production: monitoring, versioning, deployment pipelines. Unglamorous but essential infrastructure."},
    {label:"Companies preferring open-source AI frameworks",value:">90%",ctx:"Almost every company building AI prefers free, open-source tools over paid proprietary ones. The tools are free; the expertise to use them is not."},
    {label:"Companies lacking proper model deployment infrastructure",value:"~33%",ctx:"A third of companies building AI cannot reliably serve it to users. They have the model but not the plumbing to actually run it at scale."},
  ],
  players:[
    {name:"PyTorch (Meta)",role:"The tool most AI is built with",stat:"~77%",statlab:"of AI research uses it"},
    {name:"CUDA (NVIDIA)",role:"Makes GPUs programmable  -  the real moat",stat:"10M+",statlab:"developers trained on it"},
    {name:"Hugging Face",role:"The GitHub for AI models",stat:"$4.5B",statlab:"company valuation 2023"},
    {name:"Weights & Biases",role:"Tracks and logs AI training experiments",stat:"$1.25B",statlab:"company valuation"},

  forecast:{m24:"$5B",m30:"$28B",cagr:"~33%/yr",
    text:"The most interesting shift: new tools like LangChain and LlamaIndex now let you build AI applications without ever writing PyTorch code. Just as WordPress let people build websites without knowing HTML, these tools are making AI development accessible to a much wider group of engineers. The market is consolidating  -  today there are 50+ MLOps companies; by 2027, expect five or six dominant platforms to emerge. AMD is building a real alternative to CUDA called ROCm, but it remains years behind. The 10 million developers trained on CUDA are not switching their tools overnight."},

    {title:"Hugging Face NLP Course",url:"https://huggingface.co/learn/nlp-course/",desc:"Free course covering how modern language AI works  -  from the basics through fine-tuning your own model. This is how thousands of working AI engineers actually learned the field.",domain:"huggingface.co"},

{
  id:4,emoji:"🧠",
  name:"AI Models",
  tag:"Layer 4 of 5 - The Intelligence",
  analogy:"Think of this as the trained expert  -  someone who has read millions of books and can answer any question.",
  color:"#EAB308",activebg:"rgba(234,179,8,0.1)",
  desc:"This is the layer most people know: ChatGPT, Claude, Gemini. These are called foundation models  -  AI trained on enormous amounts of text, images, audio, and code until they learn to understand and generate language. Training one large model costs over $100 million and takes months. But once trained, millions of people can use it simultaneously.",
  stats:[
    {label:"OpenAI annual recurring revenue  -  2025 estimate",value:"$11.6B",ctx:"It was $3.7B in early 2024. It tripled in under a year. Spotify reached $11B in revenue after 15 years of operation. OpenAI reached it in roughly two."},
    {label:"OpenAI company valuation  -  October 2024",value:"$157B",ctx:"The most valuable private company ever created. For comparison: Boeing is worth about $90B. Ford is about $45B."},
    {label:"Times Meta's Llama AI model was downloaded",value:"10B+",ctx:"Llama is free, open-source, and can run on a good laptop. Meta released it for anyone to use. 10 billion downloads  -  more than any other AI model in history."},

  ],

  ],
  forecast:{m24:"$6.5B",m30:"$60B",cagr:"~47%/yr",
    text:"The surprising trend: AI models are becoming a commodity faster than expected. You can now download a free, open-source model (Meta's Llama 3.1) that performs comparably to GPT-4 on many standard tasks. The race has shifted from 'can we build a capable model?' to 'can we build a reasoning model?'  -  one that thinks through problems step by step, like a person working through a maths problem on paper before writing the answer. OpenAI's o1 and o3 models are the early leaders here. The next frontier is agents: AI that does not just answer questions but actually completes tasks  -  booking flights, writing and running code, managing your calendar."},

    {title:"AI Index 2024  -  Stanford HAI",url:"https://aiindex.stanford.edu/report/",desc:"Stanford's annual 500-page report on AI progress, investment, and policy. Dense, but the single best source for understanding where the field actually stands vs where the hype says it stands.",domain:"aiindex.stanford.edu"},

{
  id:5,emoji:"🚀",
  name:"Apps & Products",
  tag:"Layer 5 of 5 - What People Actually Use",
  analogy:"Think of this as the cars, trucks, and buses built using the engine  -  the things everyone actually drives.",
  color:"#10B981",activebg:"rgba(16,185,129,0.1)",
  desc:"This is what most people interact with every day. GitHub Copilot suggests code as you type. Midjourney creates images from text. Perplexity answers questions with citations. Harvey AI helps lawyers draft contracts. These products are built on top of the AI models in Layer 4  -  they do not create the intelligence, they package it into something useful.",

    {label:"GitHub Copilot annual revenue in 2025",value:"$1.5B+",ctx:"An AI that suggests code as developers type. Microsoft launched it in 2021. It crossed $1.5B in annual revenue within four years  -  faster than almost any enterprise software product ever."},

  forecast:{m24:"$45B",m30:"$600B",cagr:"~55%/yr",
    text:"We are in the land-grab phase. Think of it like the early smartphone app store  -  thousands of apps launching, most will fail, a handful will become indispensable. There are roughly 10,000 AI startups operating today. Expect consolidation to about 500 lasting companies by 2028. The four biggest fights right now: coding assistants (a $2B market heading toward $50B+); AI agents that complete multi-step tasks autonomously; vertical AI trained specifically for one profession (medicine, law, accounting); and consumer AI companions for tutoring, coaching, and creative work."},

{
  id:6,emoji:"🤔",
  name:"What This Means for You",
  tag:"Conclusion - The Human Layer",
  analogy:"Every industrial revolution displaced some workers and created entirely new jobs. This one is different only in speed.",
  color:"#EC4899",activebg:"rgba(236,72,153,0.1)",
  desc:"Understanding the AI stack is not just academic. These five layers are reshaping what employers need, what skills hold their value, and which careers face real disruption. The honest answer is not panic  -  and it is not blind optimism either. It is informed adaptation.",
  stats:[
    {label:"Jobs exposed to AI automation  -  McKinsey Global Institute",value:"~30%",ctx:"Of all work activities globally could be automated using current AI by 2030. That is not 30% of jobs eliminated  -  it is 30% of tasks within jobs, which changes roles rather than ending them entirely."},
    {label:"New jobs created per job displaced  -  World Economic Forum 2025",value:"1.7x",ctx:"The WEF's Future of Jobs 2025 report found that for every job AI displaces, roughly 1.7 new roles emerge. The challenge is that displaced and created jobs rarely require the same skills."},
    {label:"Workers who say AI has already changed their daily work",value:"75%",ctx:"PwC Global Workforce Hopes and Fears Survey 2024. Three-quarters of workers are already feeling the shift  -  not in the future, but right now."},
    {label:"Productivity gain for workers using AI tools  -  Harvard/Boston study",value:"14-40%",ctx:"A 2023 Harvard Business School study of Boston Consulting Group consultants found AI tools boosted productivity by 25-40% on cognitive tasks. The gains are real and measurable."},
    {label:"AI skills premium in the job market",value:"+20-50%",ctx:"LinkedIn Workforce Report 2024: job postings mentioning AI skills offer 20-50% higher salaries across fields including healthcare, finance, and engineering."},
    {label:"Workers with no AI training from their employer",value:"~60%",ctx:"PwC 2024: Most companies deploying AI are not adequately training the people using it. The upskilling gap is the biggest risk, and it is largely an institutional failure, not an individual one."},
  ],
  industries:[
    {
      icon:"⚖️",
      title:"Law & Legal Services",
      tagline:"High exposure on research and drafting. Low exposure on judgment, advocacy, and client relationships.",
      risk:"High task exposure",
      riskColor:"#EF4444",
      riskBg:"rgba(239,68,68,0.12)",
      body:`<p><span class="industry-stat" style="color:#EC4899">40%</span> of the Am Law 100  -  the largest law firms in America  -  already use Harvey AI for legal research and document drafting. Tasks that once took junior associates hours (searching case law, summarising contracts, identifying clause inconsistencies) now take minutes.</p>
<p>A 2023 Goldman Sachs report estimated that <span class="industry-stat" style="color:#EC4899">44%</span> of legal work tasks are susceptible to automation. The work most at risk: routine document review, first-draft contracts, discovery analysis, and basic legal research memos.</p>
<p>What AI cannot replace: courtroom advocacy, client counsel in high-stakes decisions, negotiation, ethical judgment, and the strategic reading of a situation that experienced lawyers develop over decades. The junior associate role  -  traditionally an entry point into the profession  -  is the most disrupted, because AI is competent at exactly that work.</p>
<p><strong style="color:#f0f0f8">The adaptation:</strong> Law schools are beginning to require AI literacy. The lawyers who thrive will use AI to handle research volume, freeing themselves to focus on the judgment and relationship work that clients actually pay a premium for. Those who refuse to engage with the tools will be undercut on price by those who use them to work ten times faster.</p>`,
      resources:[
        {title:"Harvey AI",url:"https://www.harvey.ai/",desc:"The dominant AI for legal work. Reading about what it does is the fastest way to understand which legal tasks are genuinely at risk."},
        {title:"Future of the Professions  -  Susskind",url:"https://www.danielsusskind.com/",desc:"Richard and Daniel Susskind's research on how AI is restructuring law, medicine, and other professions. Rigorous and not alarmist."},
      ]
    },
    {
      icon:"🏥",
      title:"Healthcare & Medicine",
      tagline:"AI as a diagnostic partner, not a replacement. The human layer remains essential.",
      risk:"Moderate task exposure",
      riskColor:"#F59E0B",
      riskBg:"rgba(245,158,11,0.12)",
      body:`<p>AI is already reading radiology scans. Google's DeepMind developed an AI that detects over 50 eye diseases from retinal scans with accuracy matching world-leading ophthalmologists. FDA-cleared AI tools now assist in reading mammograms, CT scans, and pathology slides across major hospitals.</p>
<p>A <span class="industry-stat" style="color:#EC4899">2024 JAMA</span> meta-analysis found AI diagnostics matched or exceeded specialist performance in dermatology, radiology, and pathology in controlled settings. The operative phrase: controlled settings. Real clinical environments introduce factors  -  patient history, comorbidities, communication  -  that remain deeply human.</p>
<p>The tasks most affected: administrative documentation (AI scribes now transcribe and structure clinical notes in real time), routine imaging analysis, medication dosing calculations, and triage in emergency settings. The average physician spends roughly <span class="industry-stat" style="color:#EC4899">34%</span> of their time on administrative work  -  AI is reclaiming most of that time.</p>
<p><strong style="color:#f0f0f8">The adaptation:</strong> Medical education is integrating AI literacy into curricula. The physicians who lead their institutions through AI adoption  -  understanding what the tools can and cannot do, advocating appropriately for patients  -  will define the next generation of clinical leadership.</p>`,
      resources:[
        {title:"Google DeepMind Health Research",url:"https://deepmind.google/research/",desc:"Published research on AI in medical imaging, drug discovery, and clinical decision support. Peer-reviewed and publicly available."},
        {title:"NEJM AI Journal",url:"https://ai.nejm.org/",desc:"New England Journal of Medicine's dedicated AI journal. Peer-reviewed research on how AI is changing clinical practice."},
      ]
    },
    {
      icon:"💰",
      title:"Finance & Accounting",
      tagline:"Routine number-crunching is almost entirely automated. Strategic interpretation is not.",
      risk:"High task exposure",
      riskColor:"#EF4444",
      riskBg:"rgba(239,68,68,0.12)",
      body:`<p>The accounting firm KPMG now uses AI to audit <span class="industry-stat" style="color:#EC4899">100%</span> of transactions in certain engagements  -  something previously impossible when sampling was the only practical method. PwC and Deloitte have similar capabilities. AI reads every transaction, flags anomalies, and generates draft audit commentary. What took weeks now takes hours.</p>
<p>In trading, AI systems already execute the majority of equity trades on major exchanges by volume. JPMorgan's COiN platform reviews loan agreements in seconds that previously required 360,000 hours of lawyer and analyst time annually.</p>
<p>The roles most at risk: junior bookkeepers, data entry accountants, entry-level financial analysts producing routine reports, and basic compliance monitoring. A <span class="industry-stat" style="color:#EC4899">2024 World Economic Forum</span> report listed bank tellers and data entry clerks among the fastest-declining roles globally.</p>
<p><strong style="color:#f0f0f8">The adaptation:</strong> The finance professionals gaining ground are those combining domain expertise with data fluency. Understanding how to prompt, interpret, and audit AI outputs  -  rather than produce the raw numbers  -  is rapidly becoming the core competency. The CFA Institute now includes AI literacy in its updated curriculum.</p>`,
      resources:[
        {title:"WEF Future of Jobs 2025",url:"https://www.weforum.org/reports/the-future-of-jobs-report-2025/",desc:"The most comprehensive global survey of which jobs are growing, shrinking, and changing. Published by the World Economic Forum with data from 1,000+ companies."},
        {title:"JPMorgan AI Research",url:"https://www.jpmorgan.com/technology/artificial-intelligence",desc:"One of the most aggressive AI adopters in finance. Their public research shows what the industry is actually deploying right now."},
      ]
    },
    {
      icon:"💻",
      title:"Software Engineering & IT Operations",
      tagline:"Screen-heavy engineering roles are seeing the fastest workflow change. Delivery speed rises, baseline expectations rise with it.",
      risk:"Very high task exposure",
      riskColor:"#EF4444",
      riskBg:"rgba(239,68,68,0.12)",
      body:`<p>Code assistants now handle first-draft implementation, refactoring, test scaffolding, incident summaries, and runbook generation. In practical teams, this shifts the bottleneck from typing code to making technical decisions, validating outputs, and shipping safely.</p>
<p>The most exposed work is repetitive: boilerplate CRUD, straightforward API wiring, low-complexity UI slices, basic regression checks, manual ticket grooming, and repetitive infrastructure troubleshooting. Junior-heavy tasks are compressed hardest, which is why anxiety is highest in early-career software and IT roles.</p>
<p><strong style="color:#f0f0f8">What changes by role:</strong> Developers are moving toward architecture and system-level reasoning; system engineers toward automation, reliability engineering, and policy-as-code; testers toward risk-based testing and test strategy; POs/PMs toward faster discovery loops and measurable outcomes; executives toward AI governance, portfolio prioritization, and workforce redesign.</p>
<p><strong style="color:#f0f0f8">The adaptation:</strong> Teams that formalize AI-assisted delivery standards win: approved toolchains, prompt patterns, quality gates, traceability, and security controls. Professionals who can combine AI speed with production-grade judgment are becoming the new high-leverage core.</p>`,
      resources:[
        {title:"GitHub: AI in Software Development",url:"https://github.blog/category/copilot/",desc:"Practical examples of how engineering teams use AI assistants for coding, reviews, and productivity in real workflows."},
        {title:"Google SRE Workbook",url:"https://sre.google/workbook/table-of-contents/",desc:"Foundational reliability practices that become even more important when AI increases change velocity."},
      ]
    },
    {
      icon:"✏️",
      title:"Creative & Media Industries",
      tagline:"The tools are disrupting junior creative roles. Originality, direction, and taste remain stubbornly human.",
      risk:"Moderate-high exposure",
      riskColor:"#F97316",
      riskBg:"rgba(249,115,22,0.12)",
      body:`<p>Midjourney, DALL-E, and Stable Diffusion generated an estimated <span class="industry-stat" style="color:#EC4899">15 billion</span> images in 2023 alone  -  more than the entire history of human photography up to 2000. Getty Images and Adobe Stock both report stock photo sales declined significantly as AI image generation became accessible to everyone.</p>
<p>In writing, tools like Claude and GPT-4 are used by journalists, marketers, and authors to draft first versions of content at speed. A 2024 Reuters Institute survey found that <span class="industry-stat" style="color:#EC4899">61%</span> of news organisations were already using AI in some part of their editorial process.</p>
<p>What this means in practice: the demand for generic, commodity creative work  -  basic stock photography, boilerplate marketing copy, templated design work  -  is collapsing in price and volume. The demand for distinctive creative direction, original voice, cultural judgment, and brand strategy is holding or growing.</p>
<p><strong style="color:#f0f0f8">The adaptation:</strong> The creatives thriving are those who use AI as a force multiplier on their ideas rather than a replacement for them. A designer who can produce 50 concept variations in the time it took to produce 3 is not being replaced  -  they are becoming more valuable. The skill that matters most now is the ability to direct AI outputs toward something genuinely original.</p>`,
      resources:[
        {title:"Adobe: AI and Creative Work Report",url:"https://www.adobe.com/ai/overview.html",desc:"Adobe's research on how creative professionals are actually using AI tools in their workflows  -  from Photoshop's generative fill to Firefly."},
        {title:"Reuters Institute Digital News Report",url:"https://reutersinstitute.politics.ox.ac.uk/digital-news-report/2024",desc:"Annual survey of how journalism is changing with AI. Based on data from 47 countries and 95,000+ respondents."},
      ]
    },
  ],
  upskills:[

let cur = 0;

function hx(n){return`${parseInt(n.slice(1,3),16)},${parseInt(n.slice(3,5),16)},${parseInt(n.slice(5,7),16)}`;}

function buildChart(data,color){
  const CHART_H = 180;
  const ticks = 5;

  // Y axis: use GLOBAL_CHART_MAX so bars are proportional across all layers
  const yStep = GLOBAL_CHART_MAX / ticks;
  const yLabels = [];
  for(let i=ticks;i>=0;i--){
    const v = Math.round(yStep * i);
    yLabels.push(v===0?'$0': v>=1000?`$${(v/1000).toFixed(1)}T`:`$${v}B`);
  }

  const barHeights = data.map(d => Math.max(3, Math.round(d.v / GLOBAL_CHART_MAX * CHART_H)));

  return `
  <div class="chart-wrap">
    <div class="chart-toprow">
      <div class="chart-heading">Market size - 2024 to 2030</div>
      <div class="chart-legend">
        <div class="leg-item"><div class="leg-swatch" style="background:${color}"></div>Actual</div>
        <div class="leg-item"><div class="leg-swatch leg-proj"></div>Projected</div>
      </div>
    </div>
    <div class="chart-body">
      <div class="y-axis">${yLabels.map(l=>`<div>${l}</div>`).join('')}</div>
      <div class="chart-right">
        <div class="gridlines" style="height:${CHART_H}px">
          ${Array.from({length:ticks+1},()=>`<div class="gridline"></div>`).join('')}
          <div class="bars-overlay">
            ${data.map((d,i)=>`
              <div class="bar-col">
                <div class="bar-val" style="color:${d.p?'var(--dim)':color}">${d.label}</div>
                <div class="bar${d.p?' proj':''}" style="height:${barHeights[i]}px;${d.p?'':'background:'+color}"></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="x-labels">${data.map(d=>`<div class="x-label">${d.y}</div>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

function renderLayer(L,rgb){
  const sizes=[46,95,5,6.5,45];
  const maxS=Math.max(...sizes);
  return `
    <div class="sec">
      <div class="sec-head">By the numbers</div>
      <div class="stat-grid">
        ${L.stats.map(s=>`
          <div class="stat">
            <div class="stat-label">${s.label}</div>
            <div class="stat-value" style="color:${L.color}">${s.value}</div>
            <div class="stat-context">${s.ctx}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="sec">
      <div class="sec-head">Who is in this layer</div>
      <div class="player-list">
        ${L.players.map(p=>`
          <div class="player">
            <div class="player-left">
              <div class="player-name">${p.name}</div>
              <div class="player-role">${p.role}</div>
            </div>
            <div class="player-right">
              <div class="player-stat" style="color:${L.color}">${p.stat}</div>
              <div class="player-statlab">${p.statlab}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="sec">
      <div class="sec-head">Where it is heading</div>
      <div class="forecast-nums">
        <div class="fncard">
          <div class="fnlabel">Market today (2024)</div>
          <div class="fnval" style="color:${L.color}">${L.forecast.m24}</div>
        </div>
        <div class="fncard">
          <div class="fnlabel">Market by 2030</div>
          <div class="fnval" style="color:${L.color}">${L.forecast.m30}</div>
        </div>
        <div class="fncard">
          <div class="fnlabel">Growth per year</div>
          <div class="fnval" style="color:${L.color}">${L.forecast.cagr}</div>
        </div>
      </div>
      ${buildChart(L.chart,L.color)}
      <div class="forecast-box" style="border-color:${L.color}">
        <div class="forecast-text">${L.forecast.text}</div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-head">This layer in the full stack</div>
      <div class="stack-widget">
        <p class="stack-intro">All five layers together form the AI stack. This is how large each layer's market was in 2024. Click any bar to navigate to that layer.</p>
        ${LAYERS.slice(0,5).map((ll,i)=>`
          <div class="sbar-row" onclick="go(${i})">
            <div class="sbar-name" style="color:${i===cur?'var(--white)':'var(--soft)'}">
              <span class="sbar-emoji">${ll.emoji}</span>
              <span style="font-weight:${i===cur?700:400}">${ll.name}</span>
            </div>
            <div class="sbar-track">
              <div class="sbar-fill" style="width:${Math.round(sizes[i]/maxS*100)}%;background:${i===cur?ll.color:ll.color+'55'}"></div>
            </div>
            <div class="sbar-amt">$${sizes[i]}B</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="sec">
      <div class="sec-head">Want to go further?</div>
      <div class="res-grid">
        ${L.resources.map((r,i)=>`
          <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="res-card">
            <div class="res-idx" style="color:${L.color}">${i+1}</div>
            <div>
              <div class="res-title">${r.title}</div>
              <div class="res-desc">${r.desc}</div>
              <div class="res-domain">${r.domain}</div>
            </div>
          </a>`).join('')}
      </div>
    </div>`;
}

function renderConclusion(L,rgb){
  return `
    <div class="sec">
      <div class="sec-head">The scale of change  -  in numbers</div>
      <div class="stat-grid">
        ${L.stats.map(s=>`
          <div class="stat">
            <div class="stat-label">${s.label}</div>
            <div class="stat-value" style="color:${L.color}">${s.value}</div>
            <div class="stat-context">${s.ctx}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">Industries up close</div>
      <div class="industry-grid">
        ${L.industries.map(ind=>`
          <div class="industry-card">
            <div class="industry-header">
              <div style="display:flex;align-items:flex-start;gap:14px">
                <div class="industry-icon">${ind.icon}</div>
                <div>
                  <div class="industry-title">${ind.title}</div>
                  <div class="industry-tagline">${ind.tagline}</div>
                </div>
              </div>
              <div class="industry-risk" style="color:${ind.riskColor};background:${ind.riskBg}">${ind.risk}</div>
            </div>
            <div class="industry-body">${ind.body}</div>
            <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px">
              ${ind.resources.map(r=>`
                <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="res-card" style="padding:14px 18px">
                  <div class="res-idx" style="color:${L.color};font-size:18px">→</div>
                  <div>
                    <div class="res-title" style="font-size:13px">${r.title}</div>
                    <div class="res-desc" style="font-size:12px">${r.desc}</div>
                  </div>
                </a>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">Role-based action plans  -  concrete next steps</div>
      <div class="upskill-grid">
        ${L.upskills.map(u=>`
          <div class="upskill-card">
            <div class="upskill-icon">${u.icon}</div>
            <div class="upskill-title">${u.title}</div>
            <div class="upskill-body">${u.body}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">A closing thought</div>
      <div class="closing-box" style="border-color:${L.color}">
        <p>${L.closing}</p>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">Where to learn more</div>
      <div class="res-grid">
        ${L.resources.map((r,i)=>`
          <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="res-card">
            <div class="res-idx" style="color:${L.color}">${i+1}</div>
            <div>
              <div class="res-title">${r.title}</div>
              <div class="res-desc">${r.desc}</div>
              <div class="res-domain">${r.domain}</div>
            </div>
          </a>`).join('')}
      </div>
    </div>`;
}

function render(){
  const L = LAYERS[cur];
  const rgb = hx(L.color);
  const isConclusion = cur === 5;

  // Nav tabs
  document.getElementById('nav-tabs').innerHTML = LAYERS.map((l,i)=>`
    <button class="ntab${i===cur?' on':''}"
      style="${i===cur?`border-color:rgba(${hx(l.color)},0.5);background:${l.activebg};color:var(--white)`:''}"
      onclick="go(${i})">
      <span class="ntab-emoji">${l.emoji}</span>
      <span>${l.name}</span>
    </button>`).join('');

  // Hero
  document.getElementById('hero').setAttribute('data-emoji',L.emoji);
  document.getElementById('hero').style.background=`linear-gradient(120deg,rgba(${rgb},0.08) 0%,transparent 55%)`;
  document.getElementById('h-num').style.color=L.color;
  document.getElementById('h-num').textContent=L.tag;
  document.getElementById('h-name').textContent=L.name;
  document.getElementById('h-analogy').textContent=L.analogy;
  document.getElementById('h-desc').style.borderColor=`rgba(${rgb},0.55)`;
  document.getElementById('h-desc').textContent=L.desc;

  // Page
  document.getElementById('page').innerHTML = isConclusion
    ? renderConclusion(L,rgb)
    : renderLayer(L,rgb);

  // Footer
  const fp=document.getElementById('fn-prev');
  const fn=document.getElementById('fn-next');
  if(cur===0) fp.setAttribute('disabled',''); else fp.removeAttribute('disabled');
  if(cur===LAYERS.length-1) fn.setAttribute('disabled',''); else fn.removeAttribute('disabled');

  document.getElementById('fn-pips').innerHTML=LAYERS.map((ll,i)=>`
    <button class="fpip" onclick="go(${i})"
      style="width:${i===cur?28:7}px;height:7px;background:${i===cur?ll.color:'var(--dim)'}"></button>
  `).join('');

  document.getElementById('fnav-label').textContent = cur < LAYERS.length-1
    ? `Next: ${LAYERS[cur+1].name}`
    : 'You have reached the end';
}

function go(i){cur=i;render();window.scrollTo({top:0,behavior:'smooth'});}
function prev(){if(cur>0)go(cur-1);}
function next(){if(cur<LAYERS.length-1)go(cur+1);}
window.go=go;window.prev=prev;window.next=next;

function applyDesktopScale(){
  const desktop = window.matchMedia('(min-width: 1024px)').matches;
  if(desktop){
    document.documentElement.style.zoom = '150%';
  }else{
    document.documentElement.style.zoom = '';
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')prev();
  if(e.key==='ArrowRight')next();
});

applyDesktopScale();
window.addEventListener('resize', applyDesktopScale);
render();
</script>
</body>
</html>
